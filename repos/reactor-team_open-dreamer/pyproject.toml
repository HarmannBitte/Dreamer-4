[project]
name = "open-dreamer"
version = "0.1.0"
description = "Minimal Open-Dreamer MP4 rollout inference scripts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2",
    "jax[cuda12]>=0.4.38,<0.5",
    "flax>=0.10.0,<0.11",
    "orbax-checkpoint>=0.8.0,<0.12",
    "optax>=0.2.4,<0.3",
    "omegaconf>=2.3.0,<2.4",
    "hydra-core>=1.3.2,<1.4",
    "einops>=0.8.0,<0.9",
    "imageio[ffmpeg]>=2.31",
    "tqdm>=4.66",
]

[tool.uv]
package = false

